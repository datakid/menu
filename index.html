<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEDEF" id="metaTheme">
<title>LX Menu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-45 16 16)'%3E%3Cpath d='M9 11h7v10H9a5 5 0 0 1 0-10z' fill='%2317181B'/%3E%3Cpath d='M16 11h7a5 5 0 0 1 0 10h-7z' fill='%239EA3AB'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<script>(function(){var t='light';try{var s=localStorage.getItem('lx-menu-theme');t=(s==='light'||s==='dark')?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{
  color-scheme:light;
  --ease:cubic-bezier(.22,.9,.24,1);
  --r-hero:34px;--r-card:28px;--r-bar:22px;
  --bg:#ECEDEF;--panel:#F9F9FA;--line:rgba(23,24,27,.1);
  --ink:#17181B;--ink-2:rgba(23,24,27,.66);--ink-3:rgba(23,24,27,.56);
  --primary:#17181B;--mint:#9EA3AB;
  --sheet:#fff;--sheet-bar:#D5D8DD;--sheet-line:#C9CDD3;
  --lsheet:#F7F7F8;--lline:#D5D8DD;--lbar:#DCDFE3;
  --key-bg:rgba(23,24,27,.05);--key-line:rgba(23,24,27,.16);
  --focus:#17181B;
  --hero-shadow:0 40px 70px -46px rgba(23,24,27,.3);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F11;--panel:#17181B;--line:rgba(255,255,255,.09);
  --ink:#ECEDEF;--ink-2:rgba(236,237,239,.7);--ink-3:rgba(236,237,239,.55);
  --primary:#ECEDEF;--mint:#6C7078;
  --sheet:#202226;--sheet-bar:#34373D;--sheet-line:#3A3D44;
  --lsheet:#1E2024;--lline:rgba(255,255,255,.12);--lbar:rgba(255,255,255,.14);
  --key-bg:rgba(255,255,255,.06);--key-line:rgba(255,255,255,.18);
  --focus:#ECEDEF;
  --hero-shadow:0 40px 80px -50px rgba(0,0,0,.8);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .35s var(--ease),color .35s var(--ease)}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--bg)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{width:100%;height:100dvh;padding:clamp(1rem,2.4vw,2.25rem);display:flex;flex-direction:column;gap:clamp(1rem,2vw,1.6rem);transition:opacity .35s var(--ease)}
.shell.leaving{opacity:0}

.hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;animation:rise .7s var(--ease) .05s backwards}
.brand{display:flex;align-items:center;gap:.65rem}
.mark{width:32px;height:32px;display:block}
.m-a{fill:var(--primary)}.m-b{fill:var(--mint)}
.wordmark{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.02em;font-variation-settings:'wdth' 88,'opsz' 30}

.theme{position:relative;display:flex;padding:3px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.theme-thumb{position:absolute;top:3px;left:3px;width:36px;height:30px;border-radius:99px;background:var(--ink);transform:translateX(calc(var(--i,0)*36px));transition:transform .35s var(--ease)}
.theme-opt{position:relative;z-index:1;width:36px;height:30px;border:0;background:transparent;border-radius:99px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer;transition:color .25s var(--ease)}
.theme-opt[aria-checked="true"]{color:var(--bg)}
.theme-opt svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.bento{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:clamp(.8rem,1.4vw,1.2rem)}

.card{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.card:active{transform:scale(.99)}
.card-main{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}
.card-text{min-width:0}
.card-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.035em;line-height:.94;font-variation-settings:'wdth' 80,'opsz' 96}
.card-sub{margin-top:.8rem;line-height:1.45;max-width:26ch}
.go{flex-shrink:0;width:clamp(48px,4.2vw,60px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--ease)}
.go svg{width:42%;height:42%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card:hover .go{transform:translate(3px,-3px)}
.key{position:absolute;z-index:1;top:clamp(1.2rem,2.2vw,2rem);left:clamp(1.4rem,2.6vw,2.6rem);min-width:28px;height:28px;padding:0 .5rem;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--key-line);background:var(--key-bg);font:600 .8rem 'Instrument Sans',sans-serif;color:var(--ink-3)}

.c-new{grid-column:1;grid-row:1/3;border-radius:var(--r-hero);background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--hero-shadow);padding:clamp(1.4rem,2.6vw,2.6rem);animation:rise .8s var(--ease) .12s backwards}
.c-new::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(var(--line) 1.2px,transparent 1.6px);background-size:24px 24px;-webkit-mask-image:linear-gradient(205deg,#000 0%,transparent 58%);mask-image:linear-gradient(205deg,#000 0%,transparent 58%)}
.c-new .card-title{font-size:clamp(3rem,6.6vw,6.5rem)}
.c-new .card-sub{font-size:clamp(1rem,1.25vw,1.2rem);color:var(--ink-2)}
.c-new .go{background:var(--ink);color:var(--bg)}

.sheet{position:absolute;z-index:1;top:clamp(1.4rem,3vw,2.8rem);right:clamp(1.4rem,3vw,2.8rem);width:clamp(180px,32%,310px);padding:clamp(14px,1.4vw,20px);border-radius:14px;background:var(--sheet);display:flex;flex-direction:column;gap:clamp(10px,1.1vw,16px);transform:rotate(4deg);transform-origin:80% 20%;border:1px solid var(--sheet-line);box-shadow:0 26px 44px -26px rgba(23,24,27,.35);transition:transform .55s var(--ease);pointer-events:none;animation:settle .9s var(--ease) .4s backwards}
.c-new:hover .sheet{transform:translateY(-8px) rotate(2deg)}
.s-title{display:block;height:12px;width:46%;border-radius:6px;background:var(--primary)}
.s-row{display:flex;flex-direction:column;gap:6px}
.s-label{display:block;height:6px;width:34%;border-radius:3px;background:var(--sheet-bar)}
.s-field{position:relative;display:block;height:clamp(24px,2.4vw,32px);border-radius:8px;border:1.5px solid var(--sheet-line)}
.s-field.tall{height:clamp(40px,4.6vw,58px)}
.s-field.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--line)}
.s-field::after{content:'';position:absolute;left:10px;top:50%;height:6px;width:0;border-radius:3px;background:var(--sheet-bar);transform:translateY(-50%);transition:width .7s var(--ease) var(--d,0s)}
.s-field.tall::after{top:14px;transform:none}
.s-field.on::after{display:none}
.c-new:hover .s-field::after{width:var(--fill,60%)}
.caret{position:absolute;left:10px;top:50%;width:2px;height:55%;transform:translateY(-50%);background:var(--primary);animation:blink 1.1s steps(1) infinite}
.s-plus{position:absolute;right:-14px;bottom:-14px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
.s-plus svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

.c-load{grid-column:2;grid-row:1;border-radius:var(--r-card);background:transparent;border:1px solid var(--line);padding:clamp(1.3rem,2.2vw,2.2rem);animation:rise .8s var(--ease) .2s backwards}
.c-load:hover{background:var(--panel);border-color:var(--ink-3)}
.c-load .card-title{font-size:clamp(2.1rem,3.4vw,3.3rem)}
.c-load .card-sub{font-size:clamp(.95rem,1.1vw,1.05rem);color:var(--ink-2)}
.c-load .go{background:var(--ink);color:var(--bg)}
.stack{position:absolute;top:clamp(1.3rem,2.4vw,2.2rem);right:clamp(1.3rem,2.4vw,2.2rem);width:clamp(120px,36%,190px);aspect-ratio:1.25;pointer-events:none;animation:settle .9s var(--ease) .5s backwards}
.pg{position:absolute;inset:0;border-radius:12px;background:var(--lsheet);border:1px solid var(--lline);transform-origin:20% 90%;transition:transform .5s var(--ease)}
.pg-3{transform:rotate(11deg) translate(8px,-6px)}
.pg-2{transform:rotate(5deg) translate(3px,-2px)}
.pg-1{transform:rotate(-2deg);padding:14px;display:flex;flex-direction:column;justify-content:center;gap:9px}
.c-load:hover .pg-3{transform:rotate(18deg) translate(14px,-8px)}
.c-load:hover .pg-2{transform:rotate(9deg) translate(6px,-3px)}
.c-load:hover .pg-1{transform:rotate(-4deg) translateY(-4px)}
.ln{display:block;height:7px;border-radius:4px;background:var(--lbar)}
.track{display:block;height:8px;margin-top:4px;border-radius:4px;background:var(--lbar);overflow:hidden}
.track i{display:block;height:100%;width:62%;border-radius:4px;background:var(--mint);transition:width .6s var(--ease)}
.c-load:hover .track i{width:78%}

.c-exit{grid-column:2;grid-row:2;flex-direction:row;align-items:center;justify-content:flex-start;gap:1rem;border-radius:var(--r-bar);background:transparent;border:1px solid var(--line);padding:1rem 1.3rem;animation:rise .8s var(--ease) .28s backwards}
.c-exit:hover{background:var(--panel);border-color:var(--ink-3)}
.x-ico{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease)}
.x-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.c-exit:hover .x-ico{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.c-exit .card-title{font-size:1.2rem;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variation-settings:'wdth' 90,'opsz' 24}
.c-exit .card-sub{margin:.2rem 0 0;font-size:.9rem;color:var(--ink-2)}
.c-exit .key{position:static;margin-left:auto}

.ftr{flex-shrink:0;display:flex;gap:.6rem;font-size:.8rem;color:var(--ink-3);animation:rise .8s var(--ease) .4s backwards}

.toast{position:fixed;left:50%;bottom:1.5rem;z-index:10;max-width:calc(100% - 2rem);padding:.8rem 1.1rem;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.9rem;line-height:1.35;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes settle{from{opacity:0;transform:translateY(36px) rotate(10deg)}}
@keyframes blink{50%{opacity:0}}

@media (hover:none){.key{display:none}}
@media (max-height:680px) and (min-width:861px){.sheet{scale:.82}}
@media (max-width:860px){
  body{overflow-y:auto}
  .shell{height:auto;min-height:100dvh}
  .bento{grid-template-columns:1fr;grid-template-rows:none}
  .c-new,.c-load,.c-exit{grid-column:1;grid-row:auto}
  .c-new{min-height:min(30rem,64dvh)}
  .c-new .card-title{font-size:clamp(3rem,15vw,5rem)}
  .c-load{min-height:15rem}
  .sheet{width:clamp(150px,42%,230px)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="hdr">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-45 16 16)"><path class="m-a" d="M9 11h7v10H9a5 5 0 0 1 0-10z"/><path class="m-b" d="M16 11h7a5 5 0 0 1 0 10h-7z"/></g></svg>
      <span class="wordmark">LX Menu</span>
    </div>
    <div class="theme" id="themeSwitch" role="radiogroup" aria-label="Theme">
      <span class="theme-thumb"></span>
      <button class="theme-opt" type="button" role="radio" data-theme-opt="system" aria-label="System theme" title="System"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
      <button class="theme-opt" type="button" role="radio" data-theme-opt="light" aria-label="Light theme" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>
      <button class="theme-opt" type="button" role="radio" data-theme-opt="dark" aria-label="Dark theme" title="Dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </header>

  <main class="bento">
    <a class="card c-new" id="newForm" href="https://finalapp-nine.vercel.app/" target="_blank" rel="noopener" aria-keyshortcuts="N">
      <kbd class="key" aria-hidden="true">N</kbd>
      <div class="sheet" aria-hidden="true">
        <span class="s-title"></span>
        <span class="s-row"><span class="s-label"></span><span class="s-field on"><span class="caret"></span></span></span>
        <span class="s-row"><span class="s-label" style="width:26%"></span><span class="s-field" style="--fill:62%;--d:.1s"></span></span>
        <span class="s-row"><span class="s-label" style="width:40%"></span><span class="s-field tall" style="--fill:74%;--d:.25s"></span></span>
        <span class="s-plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      </div>
      <div class="card-main">
        <div class="card-text">
          <div class="card-title">New form</div>
          <div class="card-sub">Start a blank submission with no leftover fields.</div>
        </div>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
      </div>
      <span class="sr-only">Opens in a new tab</span>
    </a>

    <a class="card c-load" id="loadForm" href="https://dashboard2-iota.vercel.app/" target="_blank" rel="noopener" aria-keyshortcuts="L">
      <kbd class="key" aria-hidden="true">L</kbd>
      <div class="stack" aria-hidden="true">
        <span class="pg pg-3"></span>
        <span class="pg pg-2"></span>
        <span class="pg pg-1"><span class="ln" style="width:78%"></span><span class="ln" style="width:56%"></span><span class="track"><i></i></span></span>
      </div>
      <div class="card-main">
        <div class="card-text">
          <div class="card-title">Load form</div>
          <div class="card-sub">Pick up a submission that's already in progress.</div>
        </div>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
      </div>
      <span class="sr-only">Opens in a new tab</span>
    </a>

    <button class="card c-exit" id="exitBtn" type="button" aria-keyshortcuts="X">
      <span class="x-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
      <div class="card-text">
        <div class="card-title">Exit</div>
        <div class="card-sub">Close this window</div>
      </div>
      <kbd class="key" aria-hidden="true">X</kbd>
    </button>
  </main>

  <footer class="ftr"><span>LX Menu</span><span>v1.5</span></footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const root=document.documentElement;
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const KEY='lx-menu-theme';
  const modes=['system','light','dark'];
  const sw=document.getElementById('themeSwitch');
  const opts=Array.from(sw.querySelectorAll('.theme-opt'));
  const metaTheme=document.getElementById('metaTheme');
  let mode='system';
  try{const s=localStorage.getItem(KEY);if(modes.includes(s))mode=s}catch(_){}

  function apply(){
    const resolved=mode==='system'?(mq.matches?'dark':'light'):mode;
    root.setAttribute('data-theme',resolved);
    metaTheme.setAttribute('content',resolved==='dark'?'#0E0F11':'#ECEDEF');
    sw.style.setProperty('--i',modes.indexOf(mode));
    opts.forEach(b=>b.setAttribute('aria-checked',String(b.dataset.themeOpt===mode)));
  }

  mq.addEventListener('change',()=>{if(mode==='system')apply()});
  opts.forEach(b=>b.addEventListener('click',()=>{
    mode=b.dataset.themeOpt;
    try{localStorage.setItem(KEY,mode)}catch(_){}
    apply();
  }));
  apply();

  const toast=document.getElementById('toast');
  let toastTimer;
  function notify(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),4200);
  }

  const shell=document.getElementById('shell');
  const exitBtn=document.getElementById('exitBtn');
  exitBtn.addEventListener('click',()=>{
    shell.classList.add('leaving');
    setTimeout(()=>{
      try{window.close()}catch(_){}
      setTimeout(()=>{
        shell.classList.remove('leaving');
        notify("This tab can't close itself. Close it from your browser to exit.");
      },200);
    },380);
  });

  const shortcuts={n:document.getElementById('newForm'),l:document.getElementById('loadForm'),x:exitBtn};
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.repeat)return;
    const t=e.target;
    if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    const el=shortcuts[e.key.toLowerCase()];
    if(el){e.preventDefault();el.click()}
  });
})();
</script>
</body>
</html>
